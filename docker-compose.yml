# Postgres + API, for running the whole thing with one command.
#
# Compose reads the `.env` file in this directory for INTERPOLATION only — the values below are
# what actually reaches the containers. That distinction matters here: `.env` ships with an empty
# `DB_URL` (the local default lives in `application.yml`), and feeding an empty string straight
# into the container would override that default with nothing and fail the boot. So the database
# URL is written out explicitly, pointing at the `db` service instead of localhost.

services:
  db:
    image: postgres:16-alpine
    container_name: routine-pusher-db
    environment:
      POSTGRES_DB: routine-pusher
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Override DB_PORT if you already have a Postgres on 5432 — a container of your own, or the
      # one this project used before Compose existed.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API must not start against a Postgres that is still initializing: Flyway would fail on
      # the first migration and the container would die before the database finished opening.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d routine-pusher"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: routine-pusher-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the service name, resolved on the Compose network. Not localhost: inside the
      # container, localhost is the container itself.
      DB_URL: jdbc:postgresql://db:5432/routine-pusher
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}

      # Flyway owns the schema; Hibernate only checks that the mapping matches it.
      JPA_DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}

      QUARTZ_THREADS: ${QUARTZ_THREADS:-5}
      # One instance here, so clustering stays off. Turn it on together with a second replica,
      # never before and never after: two unclustered instances fire the same reminder twice.
      QUARTZ_CLUSTERED: "false"

      # Picked up from your .env if present; absent, the chat endpoint reports itself unavailable
      # and everything else still works.
      IA_PROVEDOR: ${IA_PROVEDOR:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}

      # The browser origin allowed to call the API with the session cookie. Exact match, no
      # wildcard — CORS with credentials requires it.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

      # Scheduling uses local time with no zone attached, so the server clock has to be the
      # audience's clock. Containers run in UTC by default, which would fire every 9am reminder
      # at 6am. Same reasoning as the Dockerfile.
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      # Override API_PORT when port 8080 is already taken by an instance running from your IDE.
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # wget, not curl: the runtime image is JRE-on-Alpine and only has BusyBox.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      # The first run builds the image and boots a cold JVM; without a start period the container
      # would be declared unhealthy before it ever had a chance to answer.
      start_period: 90s
      retries: 5

volumes:
  pgdata:
