server:
  # A plataforma injeta a porta; 8080 e so o default de desenvolvimento.
  port: ${PORT:8080}

  # Desligar sem cortar disparo em andamento. Importa mais aqui do que numa API comum: um SIGTERM
  # no meio de um job deixaria o trigger travado em ACQUIRED ate o misfireThreshold expirar.
  shutdown: graceful

  # Atras do proxy da plataforma o Spring so sabe que a requisicao chegou por HTTPS lendo os headers
  # X-Forwarded-*. Sem isto ele monta o redirect do OAuth em http:// e o Google recusa.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # So health. Os demais endpoints do actuator expoem ambiente e configuracao.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: Routine-Pusher

  lifecycle:
    timeout-per-shutdown-phase: 30s

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routine-pusher}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 30 era um numero solto. Provedor gerenciado cobra conexao: no free tier do Supabase o
      # orcamento e pequeno e 30 de uma instancia so ja briga com o proprio pooler. Ver DB_POOL_SIZE
      # no .env.example.
      maximum-pool-size: ${DB_POOL_SIZE:10}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

  quartz:
    # jdbc, nao memory: com RAMJobStore todo restart apagava os triggers e os lembretes viravam
    # linhas no banco que nunca mais disparavam, sem nenhum erro. Agora o agendamento sobrevive.
    job-store-type: jdbc
    # Espera o disparo em andamento terminar antes de desligar, em vez de abandona-lo no meio.
    wait-for-jobs-to-complete-on-shutdown: true
    jdbc:
      # O Flyway e dono do schema (V2__quartz.sql). O Quartz nao cria nem verifica tabela.
      initialize-schema: never
    properties:
      org.quartz.threadPool:
        threadCount: ${QUARTZ_THREADS:5}
      org.quartz.scheduler:
        instanceName: routine-pusher
        # AUTO da um id unico por instancia. So tem efeito real com isClustered=true, mas deixa a
        # troca para varias instancias ser so virar a chave.
        instanceId: AUTO
      org.quartz.jobStore:
        driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
        # false porque hoje roda uma instancia so. Com duas instancias e isClustered=false, as duas
        # disparariam o mesmo lembrete: e o cluster que garante que so uma pega cada trigger.
        isClustered: ${QUARTZ_CLUSTERED:false}
        # Atraso a partir do qual o Quartz considera que o disparo "perdeu a hora".
        misfireThreshold: 60000

  security:
    oauth2:
      client:
        registration:
          google:
            # Default vazio de proposito: o demo nao tem login, e sem estes dois o Spring
            # simplesmente nao registra o oauth2Login (rotas protegidas respondem 401 em vez
            # de redirecionar). Sem o ":" a aplicacao declara a variavel como obrigatoria e
            # so nao quebra o boot por acidente de ordem de avaliacao.
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  jpa:
    hibernate:
      # validate, nunca create-drop nem update: quem cria e altera schema e o Flyway. O Hibernate
      # so confere no boot se o mapeamento bate com o banco — e falha alto se divergir, em vez de
      # descobrir em producao no primeiro INSERT.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}

ia:
  # Qual adapter de IA sobe: gemini (free tier, sem cartao) ou anthropic (exige credito de API).
  # So o escolhido vira bean — ver @ConditionalOnProperty nos clients.
  provedor: ${IA_PROVEDOR:gemini}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  # Trocar de modelo (ex.: subir para claude-sonnet-5) e uma variavel de ambiente, nao um deploy.
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
app:
  cors:
    # Origens de navegador autorizadas a chamar a API com o cookie de sessão. Sem curinga: CORS com
    # credencial exige origem explícita. O default cobre o Angular em desenvolvimento (ng serve);
    # em produção, o domínio do front entra por CORS_ALLOWED_ORIGINS (aceita lista separada por vírgula).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
