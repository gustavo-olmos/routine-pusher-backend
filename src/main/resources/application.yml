spring:
  application:
    name: Routine-Pusher

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routine-pusher}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 30 era um numero solto. Provedor gerenciado cobra conexao: no free tier do Supabase o
      # orcamento e pequeno e 30 de uma instancia so ja briga com o proprio pooler. Ver DB_POOL_SIZE
      # no .env.example.
      maximum-pool-size: ${DB_POOL_SIZE:10}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool:
        threadCount: 5

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  jpa:
    hibernate:
      # validate, nunca create-drop nem update: quem cria e altera schema e o Flyway. O Hibernate
      # so confere no boot se o mapeamento bate com o banco — e falha alto se divergir, em vez de
      # descobrir em producao no primeiro INSERT.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}

openai:
  api-key: ${OPENAI_API_KEY:}