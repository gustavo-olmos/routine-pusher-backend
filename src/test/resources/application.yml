# Configuração usada apenas nos testes (shadowia o application.yml principal no classpath de teste):
# banco H2 em memória e segredos de teste, para o contexto Spring subir sem Postgres/.env real.
spring:
  datasource:
    url: jdbc:h2:mem:routinepusher;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Flyway desligado nos testes de proposito: as migracoes sao SQL de Postgres e o teste roda em
  # H2. Quem garante que a migracao bate com as entidades e o ddl-auto: validate do perfil real,
  # que falha o boot se divergir.
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool:
        threadCount: 5
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-id
            client-secret: test-secret

openai:
  api-key: test

app:
  cors:
    allowed-origins: http://localhost:4200
